<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Webサイト デザイン案｜プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Shippori+Mincho:wght@500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--night:#3A78A0;--teal:#4584AA;--gold:#C9AA72;--fg:#FFFFFF;--muted:rgba(255,255,255,.66);--line:rgba(201,170,114,.45);--bad:#F0907E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 20px;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;color:var(--fg);font-family:"Noto Sans JP",sans-serif;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(ellipse 70% 50% at 30% 30%,rgba(170,210,232,.35),transparent 70%),
    linear-gradient(180deg,var(--night),var(--teal))}
.card{width:100%;max-width:420px;min-width:0;text-align:center}
.en{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.24em;margin:0;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:14px}
.en::before,.en::after{content:"";flex:none;width:24px;height:1px;background:var(--gold)}
h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:clamp(19px,6.2vw,24px);letter-spacing:.08em;line-height:1.7;margin:18px 0 8px}
.lead{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 30px}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;text-align:left}
label{font-size:13px;letter-spacing:.08em;color:var(--muted)}
.pw{display:flex;border:1px solid var(--line);background:rgba(52,108,142,.5)}
.pw:focus-within{border-color:var(--gold)}
.pw input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;letter-spacing:.1em;padding:13px 14px;min-height:50px}
.pw button{border:0;background:transparent;color:var(--gold);font:inherit;font-size:13px;padding:0 14px;cursor:pointer}
.keep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.keep input{accent-color:var(--gold);width:16px;height:16px}
.go{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:6px}
.go p{margin:0 0 2px;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.go button{display:grid;gap:2px;justify-items:center;border:0;background:var(--gold);color:#1F2D3A;font:inherit;min-height:60px;padding:10px 12px;cursor:pointer;transition:background .3s}
.go button:hover{background:#D8BD8A}
.go button b{font-family:"Shippori Mincho",serif;font-weight:500;font-size:17px;letter-spacing:.2em}
.go button small{font-size:11px;letter-spacing:.06em;opacity:.8}
.go button:disabled{opacity:.6;cursor:wait}
.is-saved .needpw{display:none}
.saved{display:none;margin:0;font-size:13px;color:var(--muted);text-align:center}
.is-saved .saved{display:block}
.saved button{border:0;background:none;color:var(--gold);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
#err{min-height:1.4em;margin:0;font-size:13px;color:var(--bad)}
.opening .card{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <p class="en">Design Preview</p>

  <form id="f" autocomplete="off">
    <label class="needpw" for="pw">パスワード</label>
    <div class="pw needpw"><input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" id="eye" aria-pressed="false">表示</button></div>
    <label class="keep needpw"><input type="checkbox" id="keep">この端末で次回から入力を省く</label>
    <p class="saved">パスワードは入力済みです。<button type="button" id="reset">入力し直す</button></p>
    <div class="go" id="go"></div>
    <p id="err" role="alert"></p>
  </form>
</div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = 'design-preview-d-key', LAST = 'design-preview-case';
const multi = Array.isArray(P.cases);
const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
let key = null;

// ボタン：案の一覧（トップ）か、「ひらく」1つ（フォーム）
if (multi) {
  document.getElementById('ttl').innerHTML = 'Webサイト デザイン案<br>' + P.cases.map((c) => c.label).join('・');
  go.insertAdjacentHTML('beforeend', '<p>ご覧になる案</p>' + P.cases.map((c) => `<button type="submit" value="${c.id}"><b>${c.label}を見る</b><small>${c.note}</small></button>`).join(''));
} else {
  document.getElementById('leadTail').textContent = '「ひらく」を押してください。';
  go.insertAdjacentHTML('beforeend', '<button type="submit" value=""><b>ひらく</b></button>');
}

async function keyFromPw(v) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
const dec = (k, box) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, k, b64(box.ct));

async function open(id) {
  let box = P;
  if (multi) {
    const c = P.cases.find((x) => x.id === id) || P.cases[0];
    const r = await fetch(c.src, { cache: 'no-cache' });
    if (!r.ok) throw new Error('load');
    box = await r.json();
    try { sessionStorage.setItem(LAST, c.id); } catch (e) {}
  }
  const html = new TextDecoder().decode(await dec(key, box));
  // ログイン画面の読み込み途中で document.open() すると追記になって止まるため、読み込み完了を待つ
  if (document.readyState !== 'complete') await new Promise((r) => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}

async function saved() {
  let raw = null;
  try { raw = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return;
  try {
    const { salt, k } = JSON.parse(raw);
    if (salt !== P.salt) throw 0;           // 公開し直すと salt が変わるので入れ直しになる
    key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    await dec(key, P.check);
    document.body.classList.add('is-saved');
    // フォームからの戻り・?case=e の直リンクは、選ぶ画面を飛ばしてその案をひらく
    let want = new URLSearchParams(location.search).get('case');
    if (!want && /\/form\//.test(document.referrer)) { try { want = sessionStorage.getItem(LAST); } catch (e) {} }
    if (!multi || want) { document.body.classList.add('opening'); await open(want); }
  } catch (e) {
    key = null; document.body.classList.remove('opening', 'is-saved');
    try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (x) {}
  }
}

document.getElementById('eye').addEventListener('click', (e) => {
  const show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
  e.currentTarget.textContent = show ? '隠す' : '表示'; e.currentTarget.setAttribute('aria-pressed', String(show));
});
document.getElementById('reset').addEventListener('click', () => {
  key = null; document.body.classList.remove('is-saved');
  try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (x) {}
  pw.focus();
});
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = '';
  const btn = e.submitter || go.querySelector('button'), label = btn.innerHTML;
  go.querySelectorAll('button').forEach((b) => (b.disabled = true));
  btn.innerHTML = '<b>' + (key ? '読み込んでいます…' : '確認しています…') + '</b>';
  try {
    if (!key) {
      let k;
      try { k = await keyFromPw(pw.value.trim()); await dec(k, P.check); } catch (x) { throw new Error('pw'); }
      key = k;
      const v = JSON.stringify({ salt: P.salt, k: btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', k)))) });
      try { sessionStorage.setItem(KEY, v); if (document.getElementById('keep').checked) localStorage.setItem(KEY, v); } catch (x) {}
      btn.innerHTML = '<b>読み込んでいます…</b>';
    }
    document.body.classList.add('opening');
    await open(btn.value);
  } catch (x) {
    document.body.classList.remove('opening');
    err.textContent = x.message === 'pw' ? 'パスワードが違います。もう一度入力してください。' : '読み込めませんでした。通信状況を確かめて、もう一度お試しください。';
    go.querySelectorAll('button').forEach((b) => (b.disabled = false)); btn.innerHTML = label;
    if (x.message === 'pw') pw.select();
  }
});
saved();
</script>
</body>
</html>
