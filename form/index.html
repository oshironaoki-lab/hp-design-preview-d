<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Webサイト デザイン案（D案）｜プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Shippori+Mincho:wght@500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--night:#0A1F27;--teal:#0D2B31;--gold:#C9AA72;--fg:#FFFFFF;--muted:rgba(255,255,255,.66);--line:rgba(201,170,114,.45);--bad:#F0907E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;color:var(--fg);font-family:"Noto Sans JP",sans-serif;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(ellipse 70% 50% at 30% 30%,rgba(46,104,112,.45),transparent 70%),
    linear-gradient(180deg,var(--night),var(--teal))}
.card{width:100%;max-width:400px;text-align:center}
.en{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:14px}
.en::before,.en::after{content:"";width:28px;height:1px;background:var(--gold)}
h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:24px;letter-spacing:.12em;line-height:1.7;margin:18px 0 8px}
.lead{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 30px}
form{display:grid;gap:14px;text-align:left}
label{font-size:13px;letter-spacing:.08em;color:var(--muted)}
.pw{display:flex;border:1px solid var(--line);background:rgba(10,31,39,.6)}
.pw:focus-within{border-color:var(--gold)}
.pw input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;letter-spacing:.1em;padding:13px 14px;min-height:50px}
.pw button{border:0;background:transparent;color:var(--gold);font:inherit;font-size:13px;padding:0 14px;cursor:pointer}
.keep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.keep input{accent-color:var(--gold);width:16px;height:16px}
#go{border:0;background:var(--gold);color:#0A1F27;font:inherit;font-weight:500;font-size:15px;letter-spacing:.2em;min-height:52px;cursor:pointer}
#go:disabled{opacity:.6;cursor:wait}
#err{min-height:1.4em;margin:0;font-size:13px;color:var(--bad)}
.opening .card{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <p class="en">Design Preview</p>
  <h1>Webサイト デザイン案<br>D案</h1>
  <p class="lead">関係者向けの確認用ページです。<br>パスワードを入力してください。</p>
  <form id="f" autocomplete="off">
    <label for="pw">パスワード</label>

    <label class="keep"><input type="checkbox" id="keep">この端末で次回から入力を省く</label>
    <button id="go" type="submit">ひらく</button>
    <p id="err" role="alert"></p>
  </form>
</div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = 'design-preview-d-key';
async function keyFromPw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  const html = new TextDecoder().decode(buf);
  // ログイン画面の読み込み途中で document.open() すると追記になって止まるため、読み込み完了を待つ
  if (document.readyState !== 'complete') await new Promise((r) => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function saved() {
  let raw = null;
  try { raw = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return;
  try {
    const { salt, k } = JSON.parse(raw);
    if (salt !== P.salt) throw 0;           // 公開し直すと salt が変わるので入れ直しになる
    const key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    document.body.classList.add('opening');
    await open(key);
  } catch (e) {
    document.body.classList.remove('opening');
    try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (x) {}
  }
}
const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
document.getElementById('eye').addEventListener('click', (e) => {
  const show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
  e.currentTarget.textContent = show ? '隠す' : '表示'; e.currentTarget.setAttribute('aria-pressed', String(show));
});
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = '確認しています…';
  try {
    const key = await keyFromPw(pw.value.trim());
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    const k = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
    const v = JSON.stringify({ salt: P.salt, k });
    try { sessionStorage.setItem(KEY, v); if (document.getElementById('keep').checked) localStorage.setItem(KEY, v); } catch (x) {}
    document.body.classList.add('opening');
    await open(key);
  } catch (x) {
    err.textContent = 'パスワードが違います。もう一度入力してください。';
    go.disabled = false; go.textContent = 'ひらく'; pw.select();
  }
});
saved();
